<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanças.DuC — Versões</title>
<style>
  body {
    background: #14161a;
    color: #e9e6df;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    margin: 0;
    padding: 32px 24px 60px;
  }
  #logo {
    height: 40px;
    display: block;
    margin: 0 0 24px;
  }
  #topo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 18px;
  }
  #btn-token {
    margin-left: auto;
    background: #1c1f24;
    border: 1px solid #2d3138;
    color: #a9aeb8;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  #btn-token:hover {
    border-color: #444a54;
    color: #e9e6df;
  }
  #btn-token.ativo {
    border-color: #2f7a3d;
    color: #6fcf7a;
  }
  #aviso-token {
    background: #1c1f24;
    border: 1px solid #2d3138;
    border-radius: 8px;
    padding: 14px 16px;
    margin: 0 0 20px;
    font-size: 13px;
    color: #a9aeb8;
    display: none;
  }
  #aviso-token.mostrar {
    display: block;
  }
  #aviso-token input {
    width: 100%;
    box-sizing: border-box;
    background: #14161a;
    border: 1px solid #2d3138;
    color: #e9e6df;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin: 8px 0;
  }
  #aviso-token button {
    background: #378ADD;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  #grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, 200px);
    justify-content: center;
    gap: 10px;
  }
  .item {
    display: flex;
    flex-direction: column;
    width: 200px;
    box-sizing: border-box;
    background: #1c1f24;
    border: 1px solid #2d3138;
    border-radius: 8px;
    overflow: hidden;
  }
  .item.visitado {
    background: #23262b;
  }
  .versao {
    font-size: 13px;
    font-weight: 600;
    color: #e9e6df;
    background: #14161a;
    padding: 8px 10px;
    text-align: center;
    text-decoration: none;
    display: block;
  }
  .versao:hover {
    background: #378ADD;
    color: #fff;
  }
  .resumo {
    width: 100%;
    box-sizing: border-box;
    background: transparent;
    color: #a9aeb8;
    border: none;
    font-family: inherit;
    font-size: 12px;
    line-height: 1.4;
    text-align: center;
    padding: 8px 12px 4px;
    resize: none;
    outline: none;
  }
  .nota {
    width: 100%;
    box-sizing: border-box;
    background: #14161a;
    color: #e9e6df;
    border: none;
    border-top: 1px solid #2d3138;
    font-family: inherit;
    font-size: 11px;
    line-height: 1.3;
    padding: 6px 8px;
    resize: none;
    height: 32px;
    outline: none;
  }
  .nota::placeholder {
    color: #5a5f68;
  }
  .item.editado .resumo,
  .item.editado .nota {
    box-shadow: inset 3px 0 0 #d9a441;
  }
  .salvando {
    font-size: 10px;
    color: #6fcf7a;
    text-align: center;
    padding: 2px 0 4px;
    min-height: 14px;
  }
  #status {
    color: #8f95a0;
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<div id="topo">
  <img id="logo" src="logo.png" alt="Finanças.DuC">
  <span style="color:#8f95a0; font-size:13px;">V2</span>
  <button id="btn-token">Configurar edição</button>
</div>

<div id="aviso-token">
  Cole aqui seu token do GitHub (criado em
  <a href="https://github.com/settings/tokens" target="_blank" style="color:#378ADD;">github.com/settings/tokens</a>,
  permissão "repo"). Ele fica salvo só neste navegador.
  <input type="password" id="input-token" placeholder="ghp_...">
  <button id="btn-salvar-token">Salvar token</button>
  <button id="btn-remover-token" style="background:#3a2f14; margin-left:6px;">Remover token</button>
</div>

<div id="status">Carregando lista de versões...</div>
<div id="grade"></div>

<script>
const OWNER = "ductrabalho";
const REPO = "Financas.DuC";
const BRANCH = "main";
const VISITADO_HORAS = 6;
const CHAVE_STORAGE = "duc_financas_visitados";
const CHAVE_TOKEN = "duc_financas_token";

function lerVisitados() {
  try {
    const raw = localStorage.getItem(CHAVE_STORAGE);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function marcarVisitado(nome) {
  const dados = lerVisitados();
  dados[nome] = Date.now();
  localStorage.setItem(CHAVE_STORAGE, JSON.stringify(dados));
}

function estaVisitadoRecente(nome) {
  const dados = lerVisitados();
  const quando = dados[nome];
  if (!quando) return false;
  const horasPassadas = (Date.now() - quando) / (1000 * 60 * 60);
  return horasPassadas < VISITADO_HORAS;
}

function lerToken() {
  return localStorage.getItem(CHAVE_TOKEN) || "";
}

function temToken() {
  return lerToken().trim().length > 0;
}

// --- painel de configuração do token ---
const btnToken = document.getElementById("btn-token");
const painelToken = document.getElementById("aviso-token");
const inputToken = document.getElementById("input-token");

function atualizarBotaoToken() {
  if (temToken()) {
    btnToken.textContent = "Edição ativada";
    btnToken.classList.add("ativo");
  } else {
    btnToken.textContent = "Configurar edição";
    btnToken.classList.remove("ativo");
  }
}

btnToken.addEventListener("click", () => {
  painelToken.classList.toggle("mostrar");
});

document.getElementById("btn-salvar-token").addEventListener("click", () => {
  const valor = inputToken.value.trim();
  if (!valor) return;
  localStorage.setItem(CHAVE_TOKEN, valor);
  inputToken.value = "";
  painelToken.classList.remove("mostrar");
  atualizarBotaoToken();
  location.reload();
});

document.getElementById("btn-remover-token").addEventListener("click", () => {
  localStorage.removeItem(CHAVE_TOKEN);
  atualizarBotaoToken();
  location.reload();
});

atualizarBotaoToken();

// Resumos + notas ficam em resumos.json. Cada versão pode estar como
// texto simples (formato antigo, gerado pelo script Python) ou como
// objeto {resumo, nota} (formato novo, depois de editado na página).
// As duas formas convivem sem problema.
let SHA_ATUAL_RESUMOS = null; // precisa pra poder salvar de volta no GitHub

async function carregarResumos() {
  try {
    const resp = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/contents/resumos.json?ref=${BRANCH}`,
      { cache: "no-store" }
    );
    if (!resp.ok) return {};
    const dados = await resp.json();
    SHA_ATUAL_RESUMOS = dados.sha;
    const texto = decodeURIComponent(escape(atob(dados.content)));
    return JSON.parse(texto || "{}");
  } catch (e) {
    return {};
  }
}

function extrairResumoENota(valor) {
  if (typeof valor === "string") return { resumo: valor, nota: "" };
  if (valor && typeof valor === "object") {
    return { resumo: valor.resumo || "", nota: valor.nota || "" };
  }
  return { resumo: "", nota: "" };
}

async function salvarResumos(resumos, mensagemCommit) {
  const token = lerToken();
  const conteudo = btoa(unescape(encodeURIComponent(JSON.stringify(resumos, null, 2) + "\n")));
  const corpo = {
    message: mensagemCommit,
    content: conteudo,
    branch: BRANCH,
  };
  if (SHA_ATUAL_RESUMOS) corpo.sha = SHA_ATUAL_RESUMOS;

  const resp = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/resumos.json`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
        Accept: "application/vnd.github+json",
      },
      body: JSON.stringify(corpo),
    }
  );
  if (!resp.ok) {
    const erro = await resp.json().catch(() => ({}));
    throw new Error(erro.message || `Falha ao salvar (${resp.status})`);
  }
  const dados = await resp.json();
  SHA_ATUAL_RESUMOS = dados.content.sha;
}

// evita salvar a cada tecla digitada — espera parar de digitar
function comAtraso(fn, ms) {
  let timer = null;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

async function carregar() {
  const status = document.getElementById("status");
  const grade = document.getElementById("grade");
  try {
    const [resp, resumos] = await Promise.all([
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`),
      carregarResumos(),
    ]);
    if (!resp.ok) throw new Error("Falha ao consultar repositório (" + resp.status + ")");
    const arquivos = await resp.json();

    const versoes = arquivos
      .filter(a => a.type === "file" && /^index-V.+\.html$/i.test(a.name) && a.name.toLowerCase() !== "index.html")
      .map(a => {
        const m = a.name.match(/^index-V([\d.]+)\.html$/i);
        const numero = m ? m[1] : a.name;
        return { nome: a.name, numero: numero };
      })
      .sort((a, b) => {
        const pa = a.numero.split(".").map(Number);
        const pb = b.numero.split(".").map(Number);
        for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
          const da = pa[i] || 0, db = pb[i] || 0;
          if (da !== db) return da - db;
        }
        return 0;
      });

    status.remove();

    if (versoes.length === 0) {
      grade.innerHTML = '<div id="status">Nenhuma versão encontrada.</div>';
      return;
    }

    for (const v of versoes) {
      const { resumo, nota } = extrairResumoENota(resumos[v.numero]);

      const item = document.createElement("div");
      item.className = "item" + (estaVisitadoRecente(v.nome) ? " visitado" : "");

      const link = document.createElement("a");
      link.className = "versao";
      link.href = v.nome;
      link.target = "_blank";
      link.textContent = "Finanças.DuC V" + v.numero;
      link.addEventListener("click", () => marcarVisitado(v.nome));

      const areaResumo = document.createElement("textarea");
      areaResumo.className = "resumo";
      areaResumo.rows = 3;
      areaResumo.value = resumo || "Ajustes e correções, resumo ainda não gerado.";
      areaResumo.readOnly = !temToken();

      const areaNota = document.createElement("textarea");
      areaNota.className = "nota";
      areaNota.rows = 2;
      areaNota.placeholder = temToken() ? "Sua observação (2 linhas)..." : "Configure a edição pra escrever aqui";
      areaNota.value = nota;
      areaNota.readOnly = !temToken();

      const linhaSalvando = document.createElement("div");
      linhaSalvando.className = "salvando";

      const salvarAgora = comAtraso(async () => {
        try {
          linhaSalvando.textContent = "Salvando...";
          const atuais = await carregarResumos();
          atuais[v.numero] = { resumo: areaResumo.value, nota: areaNota.value };
          await salvarResumos(atuais, `Atualiza resumo/nota V${v.numero}`);
          linhaSalvando.textContent = "Salvo ✓";
          item.classList.remove("editado");
          setTimeout(() => { linhaSalvando.textContent = ""; }, 2000);
        } catch (e) {
          linhaSalvando.textContent = "Erro: " + e.message;
        }
      }, 1200);

      if (temToken()) {
        areaResumo.addEventListener("input", () => {
          item.classList.add("editado");
          salvarAgora();
        });
        areaNota.addEventListener("input", () => {
          item.classList.add("editado");
          salvarAgora();
        });
      }

      item.appendChild(link);
      item.appendChild(areaResumo);
      item.appendChild(areaNota);
      item.appendChild(linhaSalvando);
      grade.appendChild(item);
    }
  } catch (err) {
    status.textContent = "Erro ao carregar a lista: " + err.message;
  }
}

carregar();
</script>

</body>
</html>
